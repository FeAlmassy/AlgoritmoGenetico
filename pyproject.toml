[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "algoritmo-genetico"
dynamic = ["version"]  # lida de src/algoritmo_genetico/__init__.py (__version__)
description = "Classificador linear (binário e ordinal) treinado por algoritmo genético, feito com NumPy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fellipe Almassy" },
    { name = "Matheus Gomes" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
]
keywords = ["algoritmo genetico", "genetic algorithm", "classificacao", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Portuguese (Brazilian)",
]

[project.urls]
Repository = "https://github.com/FeAlmassy/AlgoritmoGenetico"
Issues = "https://github.com/FeAlmassy/AlgoritmoGenetico/issues"

[tool.hatch.version]
path = "src/algoritmo_genetico/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/algoritmo_genetico"]
