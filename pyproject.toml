[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "genetic-classifier"
dynamic = ["version"]  # read from src/genetic_classifier/__init__.py (__version__)
description = "Linear classifier (binary and ordinal) trained by a genetic algorithm, built with NumPy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fellipe Almassy" },
    { name = "Matheus Gomes" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "openpyxl>=3.1",
]
keywords = ["genetic algorithm", "evolutionary algorithm", "classification", "ordinal classification", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]

[project.urls]
Repository = "https://github.com/FeAlmassy/AlgoritmoGenetico"
Issues = "https://github.com/FeAlmassy/AlgoritmoGenetico/issues"

[tool.hatch.version]
path = "src/genetic_classifier/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genetic_classifier"]
